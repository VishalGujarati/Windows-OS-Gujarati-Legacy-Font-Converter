name: Windows release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64
      - name: Install build tools
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<70" wheel
          python -m pip install "pyinstaller==5.13.2"
      - name: Build application
        shell: cmd
        run: |
          python -m PyInstaller --clean --noconfirm build\GujaratiLegacyFontConverter.spec
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Generate SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash "Output\GujaratiLegacyFontConverter-1.3.1-Setup-x64.exe" -Algorithm SHA256).Hash
          "$hash  GujaratiLegacyFontConverter-1.3.1-Setup-x64.exe" | Out-File -Encoding ascii "Output\SHA256SUMS.txt"
          Get-Content "Output\SHA256SUMS.txt"
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: GujaratiLegacyFontConverter-1.3.1-Windows-x64
          path: |
            Output/GujaratiLegacyFontConverter-1.3.1-Setup-x64.exe
            Output/SHA256SUMS.txt
